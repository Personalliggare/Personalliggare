<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Personalliggare</title>
<meta name="theme-color" content="#2f4a2f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Personalliggare">
<style>
/* Layout idea: one narrow column app (max 640px), sticky top bar, fixed bottom tab bar; state shown as coloured dots, chips and tiles. */
:root{
  --bg:#eef1ea; --surface:#ffffff; --ink:#1d241c; --muted:#5f6b5c; --line:#d6ddd0;
  --accent:#2f4a2f; --accent-ink:#ffffff; --accent-soft:#dfe8d6;
  --ok:#1e7a3a; --ok-bg:#d9f0de; --warn:#9a5600; --warn-bg:#ffe6c4; --bad:#a3121b; --bad-bg:#ffd6d8; --info:#7a6400; --info-bg:#fff1b8;
  --off:#9aa394; --off-bg:#f0f2ee;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121611; --surface:#1b2119; --ink:#e7ece3; --muted:#a3ad9e; --line:#2e372b;
    --accent:#8fb27f; --accent-ink:#10140f; --accent-soft:#26331f;
    --ok:#7fd494; --ok-bg:#183522; --warn:#ffbf6b; --warn-bg:#3d2a10; --bad:#ff8a8f; --bad-bg:#45161a; --info:#f2d46b; --info-bg:#3a3313;
    --off:#6e786a; --off-bg:#20271e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121611; --surface:#1b2119; --ink:#e7ece3; --muted:#a3ad9e; --line:#2e372b;
  --accent:#8fb27f; --accent-ink:#10140f; --accent-soft:#26331f;
  --ok:#7fd494; --ok-bg:#183522; --warn:#ffbf6b; --warn-bg:#3d2a10; --bad:#ff8a8f; --bad-bg:#45161a; --info:#f2d46b; --info-bg:#3a3313;
  --off:#6e786a; --off-bg:#20271e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.85;font-weight:500}
.iconbtn{background:transparent;border:0;color:inherit;padding:8px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:22px;height:22px}
main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav.tabs .in{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{background:none;border:0;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .badge{position:absolute;top:2px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sect h2{margin:0;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;display:flex;justify-content:space-between;gap:8px}
.sect .body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:20px;height:20px;color:var(--muted)}
.search input{border:0;background:transparent;padding:12px 0;width:100%;outline:none;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:active{background:var(--accent-soft)}
.av{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--ok-bg);color:var(--ok);position:relative}
.av.s2{background:var(--warn-bg);color:var(--warn)} .av.s3{background:var(--bad-bg);color:var(--bad)} .av.s4{background:var(--info-bg);color:var(--info)}
.item .name{font-weight:700}
.item .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p1{background:var(--ok-bg);color:var(--ok)} .p2{background:var(--warn-bg);color:var(--warn)} .p3{background:var(--bad-bg);color:var(--bad)} .p4{background:var(--info-bg);color:var(--info)} .p0{background:var(--off-bg);color:var(--off)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:999px;padding:14px 20px}
.banner{border-radius:var(--radius);padding:12px 14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--bad);color:#fff}
.banner.note{background:var(--info-bg);color:var(--info)}
.banner .w{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.banner .w b{font-weight:800}
.hero{display:flex;flex-direction:column;gap:2px}
.hero .nm{font-size:26px;font-weight:800;line-height:1.15;text-wrap:balance}
.hero .ro{font-size:15px;color:var(--muted);font-weight:600}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions a{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}
.actions a svg{width:22px;height:22px;color:var(--accent)}
.actions a[aria-disabled="true"]{opacity:.4;pointer-events:none}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:9px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv .k{color:var(--muted);font-size:14px;flex:0 0 auto}
.kv .v{font-weight:600;text-align:right;word-break:break-word}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border-radius:10px;padding:10px 12px;background:var(--off-bg);color:var(--off);display:flex;flex-direction:column;gap:2px}
.tile .t{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.tile .d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.s1{background:var(--ok-bg);color:var(--ok)} .tile.s2{background:var(--warn-bg);color:var(--warn)} .tile.s3{background:var(--bad-bg);color:var(--bad)} .tile.s4{background:var(--info-bg);color:var(--info)}
.edu{display:flex;flex-wrap:wrap;gap:6px}
.edu span{border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;background:var(--off-bg);color:var(--off)}
.edu span.on{background:var(--ok-bg);color:var(--ok)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.inp{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:700;text-align:left;width:100%}
.toggle .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--off);display:grid;place-items:center;flex:0 0 24px}
.toggle[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.toggle[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.toggle .box svg{width:16px;height:16px;display:none}
.toggle[aria-pressed="true"] .box svg{display:block}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.wrow .toggle{padding:10px}
.edugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fbrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;border-bottom:1px dashed var(--line);padding-bottom:10px}
.fbrow .typ,.fbrow .note{grid-column:1/-1}
.x{background:var(--bad-bg);color:var(--bad);border:0;border-radius:10px;width:44px;height:44px;display:grid;place-items:center}
.x svg{width:20px;height:20px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card{display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;border-radius:5px;background:var(--off-bg);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));gap:16px;max-width:480px;margin:0 auto}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo svg{width:36px;height:36px}
.center h1{margin:0;font-size:28px;line-height:1.15}
.pin{font-size:28px;letter-spacing:8px;text-align:center;padding:14px}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:20px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:18px;padding:18px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom)}
.modal h3{margin:0;font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.dirty{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:10px 12px;font-weight:700;font-size:14px}
.dirty button{margin-left:auto;background:var(--warn);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:800}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.hidden{display:none !important}
@media (prefers-reduced-motion: no-preference){.item,.btn,.chip,.toggle{transition:background .15s,border-color .15s}}
</style>
</head>

async function loadModel(bytes) {

  const cols = []; let sect = '';
  for (let i = 1; i <= 300; i++) {
    const L = numToCol(i); if (P[L + '1'] != null) sect = String(P[L + '1']);
    const h = P[L + '2']; if (h == null) { if (i > 2) break; continue; }
    cols.push({ L, h: String(h).trim(), sect, kind: kindOf(String(h).trim(), sect) });
  }
  if (!cols.find(c => c.h === 'Efternamn')) throw new Error('Hittar inte kolumnen "Efternamn" i fliken Personal.');
  const people = [];
  for (let r = 3; r < 3 + CAP_PERSONS; r++) {

    if (!has) continue;
    const p = { id: uid(), v: {} };
    for (const c of cols) {
      let x = P[c.L + r]; if (x == null || x === '') continue;
      if (c.kind === 'check' || c.kind === 'weapon') x = isChecked(x);

      if (x !== false) p.v[c.h] = x;

  for (let r = 2; r < 2 + CAP_FB; r++) {

    fb.push({ id: uid(), name: String(F['A' + r] ?? ''), typ: String(F['B' + r] ?? ''), date: F['C' + r] ?? null, note: String(F['D' + r] ?? '') });
  }
  const N = (await readSheet(book, 'Inställningar')) || {};
  const settings = { VarnMan: num(N.C3, 6), KpMan: num(N.C4, 12), KpVarn: num(N.C5, 1) };

    sd.insertBefore(row, before); rows.set(r, row);

async function buildXlsx() {

  await edit('Personal', ix => {

/* ---------- domain logic ---------- */
const fullName = p => [p.v['Förnamn'], p.v['Efternamn']].filter(Boolean).join(' ').trim();
const colsOf = k => S.model.cols.filter(c => c.kind === k);
const kpOf = w => S.model.cols.find(c => c.h === w + ' senaste godkända kp');

function fbOf(p) { const n = fullName(p); return S.model.fb.filter(f => f.name === n); }
function warnings(p) {
  const W = [], st = S.model.settings;
  const sd = p.v['Skyddsvakt förordnande giltigt till'];
  if (typeof sd === 'number') { const s = dateStatus(sd, st.VarnMan); if (s === 3) W.push({ l: 3, t: `Skyddsvaktsförordnandet gick ut ${serialToISO(sd)}` }); else if (s === 2) W.push({ l: 2, t: `Skyddsvaktsförordnandet går ut ${serialToISO(sd)} (om ${daysLeft(sd)} dagar)` }); }
  else if (sd) W.push({ l: 4, t: `Skyddsvakt: datumet är ofullständigt (${sd})` });
  for (const f of fbOf(p)) { const s = dateStatus(f.date, st.VarnMan); if (s === 3) W.push({ l: 3, t: `Förarbevis ${f.typ} gick ut ${serialToISO(f.date)}` }); else if (s === 2) W.push({ l: 2, t: `Förarbevis ${f.typ} går ut ${serialToISO(f.date)} (om ${daysLeft(f.date)} dagar)` }); }
  for (const w of colsOf('weapon')) { const kc = kpOf(w.h); const d = kc && p.v[kc.h]; const s = kpStatus(d); if (s >= 2) { const e = edate(d, st.KpMan); W.push({ l: s, t: s === 3 ? `Kompetensprov ${w.h} gick ut ${serialToISO(e)}` : `Kompetensprov ${w.h} går ut ${serialToISO(e)}` }); } }

}
const level = p => warnings(p).reduce((m, w) => Math.max(m, w.l === 4 ? 1.5 : w.l), 1);

/* ---------- encrypted storage ---------- */
function idb() {

async function loadBytes(bytes, name, demo = false) {
  const model = await loadModel(bytes);
  S.model = model; S.fileBytes = bytes; S.fileName = name; S.demo = demo; S.q = ''; S.filter = 'alla'; S.komp = '';
  if (S.key) { S.persist = true; await persistNow(); S.view = 'list'; }
  else S.view = 'setpin';
  render();
}
function fileOutName() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `Personalliggare_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.xlsx`; }
async function exportFile(mode) {
  let bytes; try { bytes = await buildXlsx(); } catch (e) { toast('Kunde inte skapa filen: ' + e.message); return; }
  const name = fileOutName(); const blob = new Blob([bytes], { type: XLSX_MIME });
  const done = () => { S.fileBytes = bytes; S.model.dirty = false; persistSoon(); render(); };
  if (S.downloads) {
    try { await S.downloads.save({ filename: name, data: blob }); done(); toast('Filen är sparad'); }
    catch (e) { if (e && e.code === 'declined') return; toast('Det gick inte att spara filen här.'); }
    return;
  }
  if (mode === 'share') {
    try { await navigator.share({ files: [new File([blob], name, { type: XLSX_MIME })], title: name }); done(); toast('Filen är delad'); }
    catch (e) { if (e && e.name === 'AbortError') return; toast('Delning gick inte. Spara filen i stället.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); done(); toast('Filen är sparad i Hämtade filer');
}
function saveDraft() {
  const d = S.draft, m = S.model, v = d.v; const err = $('#err');
  for (const k of Object.keys(v)) { if (typeof v[k] === 'string') v[k] = v[k].trim(); if (v[k] === '' || v[k] === false) delete v[k]; }
  if (!v['Förnamn'] && !v['Efternamn']) { err.textContent = 'Skriv förnamn eller efternamn.'; err.scrollIntoView({ block: 'center' }); return; }
  const tmp = { v }; const nn = fullName(tmp);
  if (m.people.some(p => p.id !== d.id && fullName(p).toLowerCase() === nn.toLowerCase())) { err.textContent = `Det finns redan en person som heter ${nn}. Lägg till t.ex. en initial så att namnen skiljer sig åt.`; err.scrollIntoView({ block: 'center' }); return; }
  if (!d.id && m.people.length >= CAP_PERSONS) { err.textContent = `Filen har plats för ${CAP_PERSONS} personer.`; return; }
  const fbClean = d.fb.filter(f => f.typ || f.date || f.note).map(f => ({ ...f, name: nn }));
  const others = m.fb.filter(f => f.name !== (d.oldName ?? '\u0000'));
  if (others.length + fbClean.length > CAP_FB) { err.textContent = `Filen har plats för ${CAP_FB} förarbevis totalt.`; return; }
  if (d.id) { const p = m.people.find(x => x.id === d.id); p.v = v; }
  else { d.id = uid(); m.people.push({ id: d.id, v }); }
  const insertAt = m.fb.findIndex(f => f.name === d.oldName);
  m.fb = others; if (insertAt >= 0 && insertAt <= others.length) m.fb.splice(insertAt, 0, ...fbClean); else m.fb.push(...fbClean);
  changed(); S.sel = d.id; S.draft = null; S.view = 'card'; render(); scrollTo(0, 0); toast('Sparat');
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'open') { $('#fileIn').value = ''; $('#fileIn').click(); }
  else if (a === 'demo') { try { await loadBytes(b64dec(DEMO_B64), 'Exempel.xlsx', true); } catch (er) { $('#err').textContent = er.message; } }
  else if (a === 'setpin' || a === 'savenewpin') {
    const p1 = $('#p1').value, p2 = $('#p2').value, err = $('#err');
    if (p1.length < 6) { err.textContent = 'PIN-koden måste ha minst 6 tecken.'; return; }
    if (p1 !== p2) { err.textContent = 'PIN-koderna är inte lika.'; return; }
    b.disabled = true; b.textContent = 'Krypterar …';
    S.salt = crypto.getRandomValues(new Uint8Array(16)); S.key = await deriveKey(p1, S.salt); S.persist = true; await persistNow();
    S.view = 'list'; render(); toast('Uppgifterna är sparade krypterat');
  }
  else if (a === 'nopin') { S.persist = false; S.view = 'list'; render(); }
  else if (a === 'gopin' || a === 'newpin') { S.view = 'setpin'; render(); }
  else if (a === 'unlock') {
    const err = $('#err'); if (Date.now() < S.lockUntil) return; const pin = $('#pin').value; if (!pin) return;
    b.disabled = true; b.textContent = 'Låser upp …';
    try { await unlock(pin); S.fails = 0; S.view = 'list'; S.lastAct = Date.now(); render(); }
    catch (er) { S.fails++; if (S.fails >= 5) { S.lockUntil = Date.now() + 30000 * (S.fails - 4); } b.disabled = false; b.textContent = 'Lås upp'; err.textContent = S.fails >= 5 ? `Fel PIN-kod. Vänta ${30 * (S.fails - 4)} s.` : 'Fel PIN-kod.'; $('#pin').value = ''; $('#pin').focus(); }
  }
  else if (a === 'forgot') { if (await dialog({ title: 'Radera sparad data?', text: 'Utan PIN-koden går uppgifterna inte att öppna. Du kan radera dem och öppna Excel-filen på nytt. Filen i Signal påverkas inte.', ok: 'Radera', danger: true })) wipe(); }
  else if (a === 'tab') { S.view = b.dataset.v; S.sel = null; render(); scrollTo(0, 0); }
  else if (a === 'back') {
    if (S.view === 'edit') { const wasNew = !S.draft.id; if (!await dialog({ title: 'Avbryta redigeringen?', text: 'Ändringar som inte är sparade försvinner.', ok: 'Avbryt redigering', cancel: 'Fortsätt redigera' })) return; S.draft = null; S.view = wasNew ? 'list' : 'card'; }
    else S.view = 'list';
    render(); scrollTo(0, 0);
  }
  else if (a === 'card') { S.sel = b.dataset.id; S.view = 'card'; render(); scrollTo(0, 0); }
  else if (a === 'filter') { S.filter = b.dataset.v; render(); }
  else if (a === 'new') startEdit(null);
  else if (a === 'edit') startEdit(S.model.people.find(x => x.id === S.sel));
  else if (a === 'tog') { const f = b.dataset.f; S.draft.v[f] = !S.draft.v[f]; b.setAttribute('aria-pressed', String(!!S.draft.v[f])); }
  else if (a === 'fbadd') { S.draft.fb.push({ id: uid(), typ: '', date: null, note: '' }); S.keepScroll = true; render(); const i = S.draft.fb.length - 1; const el = $('#fbt' + i); if (el) el.focus(); }
  else if (a === 'fbdel') { S.draft.fb.splice(+b.dataset.i, 1); S.keepScroll = true; render(); }
  else if (a === 'saveedit') saveDraft();
  else if (a === 'delete') {
    const p = S.model.people.find(x => x.id === S.draft.id);
    if (!await dialog({ title: `Ta bort ${fullName(p)}?`, text: 'Personen och personens förarbevis tas bort ur listan.', ok: 'Ta bort', danger: true })) return;
    const n = fullName(p); S.model.people = S.model.people.filter(x => x.id !== p.id); S.model.fb = S.model.fb.filter(f => f.name !== n);
    changed(); S.draft = null; S.view = 'list'; render(); toast('Personen är borttagen');
  }
  else if (a === 'share') exportFile('share');
  else if (a === 'download') exportFile('download');
  else if (a === 'locknow') lock();
  else if (a === 'wipe') { if (await dialog({ title: 'Radera all data?', text: 'Allt som appen har sparat på enheten raderas. Excel-filerna i Signal påverkas inte.', ok: 'Radera', danger: true })) wipe(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (S.view === 'edit' && S.draft) {
    if (t.dataset.f) { S.draft.v[t.dataset.f] = t.dataset.date ? (t.value ? isoToSerial(t.value) : '') : t.value; }
    if (t.dataset.fb !== undefined) { const f = S.draft.fb[+t.dataset.fb]; f[t.dataset.k] = t.dataset.k === 'date' ? (t.value ? isoToSerial(t.value) : null) : t.value; }
  }
  if (S.view === 'settings' && t.dataset.s) { const n = Number(t.value); if (t.value !== '' && isFinite(n) && n >= 0) { S.model.settings[t.dataset.s] = n; changed(); } }
  if (t.id === 'fbt') { S.model.fbTypes = t.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 40); changed(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'komp') { S.komp = t.value; render(); }
  if (t.id === 'auto') { S.autoMin = +t.value; try { localStorage.setItem('autoMin', t.value); } catch (er) {} }
  if (S.view === 'edit' && t.tagName === 'SELECT' && t.dataset.f) S.draft.v[t.dataset.f] = t.value;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (S.view === 'lock' && e.target.id === 'pin') $('[data-a="unlock"]').click();
  if (S.view === 'setpin' && (e.target.id === 'p1' || e.target.id === 'p2')) $('[data-a="setpin"]').click();
});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  if (S.model && S.model.dirty && !await dialog({ title: 'Öppna en annan fil?', text: 'Du har ändringar som inte är delade. De försvinner om du öppnar en annan fil.', ok: 'Öppna ändå', danger: true })) return;
  try { await loadBytes(new Uint8Array(await f.arrayBuffer()), f.name); toast('Filen är inläst'); }
  catch (er) { const m = 'Kunde inte läsa filen: ' + er.message; const el = $('#err'); if (el) el.textContent = m; else toast(m); }
});

/* ---------- auto-lock ---------- */
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
setInterval(() => {
  if (S.view === 'lock' && S.lockUntil > Date.now()) render();
  if (S.persist && S.key && S.model && Date.now() - S.lastAct > S.autoMin * 60000) lock();
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.hiddenAt = Date.now(); persistNow(); }
  else if (S.persist && S.key && S.model && S.hiddenAt && Date.now() - S.hiddenAt > 60000) lock();
});

/* ---------- boot ---------- */
(async function boot() {
  try { const a = +localStorage.getItem('autoMin'); if (a) S.autoMin = a; } catch (e) {}
  try { S.hasVault = !!(await kv('get', 'vault')); } catch (e) { S.hasVault = false; }
  S.view = S.hasVault ? 'lock' : 'start'; render();
  if (window.claude && typeof window.claude.use === 'function') { try { S.downloads = await window.claude.use('downloads'); if (S.view === 'save') render(); } catch (e) {} }
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
