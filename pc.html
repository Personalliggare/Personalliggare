<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://hv.landiqdefence.se; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>PersonalliggarePC</title>
<meta name="theme-color" content="#2f4a2f">
<link rel="manifest" href="manifest-pc.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PersonalliggarePC">
<style>
/* Layout idea: one narrow column app (max 640px), sticky top bar, fixed bottom tab bar; state shown as coloured dots, chips and tiles. */
:root{
  --bg:#eef1ea; --surface:#ffffff; --ink:#1d241c; --muted:#5f6b5c; --line:#d6ddd0;
  --accent:#2f4a2f; --accent-ink:#ffffff; --accent-soft:#dfe8d6;
  --ok:#1e7a3a; --ok-bg:#d9f0de; --warn:#9a5600; --warn-bg:#ffe6c4; --bad:#a3121b; --bad-bg:#ffd6d8; --info:#7a6400; --info-bg:#fff1b8; --alert:#a3121b;
  --off:#9aa394; --off-bg:#f0f2ee;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121611; --surface:#1b2119; --ink:#e7ece3; --muted:#a3ad9e; --line:#2e372b;
    --accent:#8fb27f; --accent-ink:#10140f; --accent-soft:#26331f;
    --ok:#7fd494; --ok-bg:#183522; --warn:#ffbf6b; --warn-bg:#3d2a10; --bad:#ff8a8f; --bad-bg:#45161a; --info:#f2d46b; --info-bg:#3a3313; --alert:#b3141c;
    --off:#6e786a; --off-bg:#20271e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121611; --surface:#1b2119; --ink:#e7ece3; --muted:#a3ad9e; --line:#2e372b;
  --accent:#8fb27f; --accent-ink:#10140f; --accent-soft:#26331f;
  --ok:#7fd494; --ok-bg:#183522; --warn:#ffbf6b; --warn-bg:#3d2a10; --bad:#ff8a8f; --bad-bg:#45161a; --info:#f2d46b; --info-bg:#3a3313; --alert:#b3141c;
  --off:#6e786a; --off-bg:#20271e; color-scheme:dark;
}
/* Teman som användaren väljer under Inställningar (sparas i telefonen) */
:root[data-skin="blue"]{
  --bg:#eef3f9; --surface:#ffffff; --ink:#132030; --muted:#56687c; --line:#d2dce8;
  --accent:#1f4f8f; --accent-ink:#ffffff; --accent-soft:#dbe7f6;
  --ok:#1e7a3a; --ok-bg:#d9f0de; --warn:#9a5600; --warn-bg:#ffe6c4; --bad:#a3121b; --bad-bg:#ffd6d8; --info:#7a6400; --info-bg:#fff1b8; --alert:#a3121b;
  --off:#93a0ae; --off-bg:#eef1f5; color-scheme:light;
}
:root[data-skin="red"]{
  --bg:#0d0d0e; --surface:#18181a; --ink:#f2eeee; --muted:#aaa3a3; --line:#2d2a2b;
  --accent:#c62828; --accent-ink:#ffffff; --accent-soft:#3b1416;
  --ok:#7fd494; --ok-bg:#16301f; --warn:#ffbf6b; --warn-bg:#3d2a10; --bad:#ff8a8f; --bad-bg:#4a1519; --info:#f2d46b; --info-bg:#3a3313; --alert:#b3141c;
  --off:#6f6a6b; --off-bg:#222022; color-scheme:dark;
}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skins button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--ink)}
.skins button[aria-pressed="true"]{border-color:var(--accent)}
.skins .sw{width:44px;height:26px;border-radius:7px;display:flex;overflow:hidden;border:1px solid rgba(0,0,0,.15)}
.skins .sw i{flex:1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.85;font-weight:500}
.iconbtn{background:transparent;border:0;color:inherit;padding:8px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:22px;height:22px}
main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav.tabs .in{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{background:none;border:0;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .badge{position:absolute;top:2px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sect h2{margin:0;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;display:flex;justify-content:space-between;gap:8px}
.sect .body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:20px;height:20px;color:var(--muted)}
.search input{border:0;background:transparent;padding:12px 0;width:100%;outline:none;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:active{background:var(--accent-soft)}
.av{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--ok-bg);color:var(--ok);position:relative}
.av.s2{background:var(--warn-bg);color:var(--warn)} .av.s3{background:var(--bad-bg);color:var(--bad)} .av.s4{background:var(--info-bg);color:var(--info)}
.item .name{font-weight:700}
.item .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p1{background:var(--ok-bg);color:var(--ok)} .p2{background:var(--warn-bg);color:var(--warn)} .p3{background:var(--bad-bg);color:var(--bad)} .p4{background:var(--info-bg);color:var(--info)} .p0{background:var(--off-bg);color:var(--off)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:999px;padding:14px 20px}
.banner{border-radius:var(--radius);padding:12px 14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--alert);color:#fff}
.banner.note{background:var(--info-bg);color:var(--info)}
.banner .w{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.banner .w b{font-weight:800}
.hero{display:flex;flex-direction:column;gap:2px}
.hero .nm{font-size:26px;font-weight:800;line-height:1.15;text-wrap:balance}
.hero .ro{font-size:15px;color:var(--muted);font-weight:600}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions a{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}
.actions a svg{width:22px;height:22px;color:var(--accent)}
.actions a[aria-disabled="true"]{opacity:.4;pointer-events:none}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:9px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv .k{color:var(--muted);font-size:14px;flex:0 0 auto}
.kv .v{font-weight:600;text-align:right;word-break:break-word}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border-radius:10px;padding:10px 12px;background:var(--off-bg);color:var(--off);display:flex;flex-direction:column;gap:2px}
.tile .t{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.tile .d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.s1{background:var(--ok-bg);color:var(--ok)} .tile.s2{background:var(--warn-bg);color:var(--warn)} .tile.s3{background:var(--bad-bg);color:var(--bad)} .tile.s4{background:var(--info-bg);color:var(--info)}
.edu{display:flex;flex-wrap:wrap;gap:6px}
.edu span{border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;background:var(--off-bg);color:var(--off)}
.edu span.on{background:var(--ok-bg);color:var(--ok)}
.sect h2 .cnt{font-size:14px;letter-spacing:0;text-transform:none;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--off-bg);color:var(--off);align-self:center}
.sect h2 .cnt.on{background:var(--ok-bg);color:var(--ok)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
textarea.inp{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:700;text-align:left;width:100%}
.toggle .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--off);display:grid;place-items:center;flex:0 0 24px}
.toggle[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.toggle[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.toggle .box svg{width:16px;height:16px;display:none}
.toggle[aria-pressed="true"] .box svg{display:block}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.wrow .toggle{padding:10px}
.edugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,8.6em),1fr));gap:8px}
.toggle>span:last-child{min-width:0;overflow-wrap:break-word;hyphens:auto}
.seg{display:flex;gap:6px;margin-top:4px}

.syncl{font-size:13px;font-weight:600;color:var(--muted);padding:2px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syncl.bad{color:var(--bad)}
.syncl button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font-weight:700}
label.rv{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
label.rv:last-of-type{border-bottom:0}
label.rv input{width:22px;height:22px;margin-top:2px;flex-shrink:0;accent-color:var(--accent)}
label.rv .grow{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.item.ord{gap:8px}.item.ord .onum{width:26px;text-align:center;font-weight:800;color:var(--muted)}
.iconbtn.mv{min-width:44px;min-height:44px;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:0}
.iconbtn.mv:disabled{opacity:.3}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.seg button[data-v="Ej genomfört"][aria-pressed="true"]{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.seg button[data-v="Ej behov"][aria-pressed="true"],.seg button[data-v="Nej"][aria-pressed="true"]{border-color:var(--off);background:var(--off-bg);color:var(--ink)}
.fbrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;border-bottom:1px dashed var(--line);padding-bottom:10px}
.fbrow .typ,.fbrow .note{grid-column:1/-1}
.x{background:var(--bad-bg);color:var(--bad);border:0;border-radius:10px;width:44px;height:44px;display:grid;place-items:center}
.x svg{width:20px;height:20px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card{display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;border-radius:5px;background:var(--off-bg);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));gap:16px;max-width:480px;margin:0 auto}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo svg{width:36px;height:36px}
.center h1{margin:0;font-size:28px;line-height:1.15}
.pin{font-size:28px;letter-spacing:8px;text-align:center;padding:14px}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:20px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:18px;padding:18px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom)}
.modal h3{margin:0;font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90%;text-align:center}
.dirty{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:10px 12px;font-weight:700;font-size:14px}
.dirty button{margin-left:auto;background:var(--warn);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:800}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.hidden{display:none !important}
/* ---------- PersonalliggarePC: datorlayout för ledningen ---------- */
body.pc .wrap{max-width:none;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%;margin:0}
.pcside{position:sticky;top:0;height:100vh;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:4px;padding:18px 12px}
.pcside .brand{font-weight:800;font-size:17px;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}
.pcside .brand svg{width:22px;height:22px}
.pcside button{background:none;border:0;color:inherit;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-weight:700;font-size:15px;opacity:.85;text-align:left}
.pcside button svg{width:20px;height:20px}
.pcside button:hover{opacity:1;background:rgba(255,255,255,.08)}
.pcside button[aria-current="page"]{background:rgba(255,255,255,.18);opacity:1}
.pcside .foot{margin-top:auto;font-size:12px;opacity:.75;padding:10px}
.pcmain{min-width:0;display:flex;flex-direction:column}
.pchead{position:sticky;top:0;z-index:4;background:var(--bg);padding:18px 28px 14px;display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line)}
.pchead h1{margin:0;font-size:24px;line-height:1.1}
.pchead .sub{color:var(--muted);font-size:14px;font-weight:600;margin-top:4px}
.pcbody{padding:18px 28px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pcbody.narrow{max-width:760px}
.pcfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pcfilters .search{min-width:260px;flex:0 1 340px}
.ptwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:calc(100vh - 230px)}
table.pt{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
.pt th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;padding:8px;border-bottom:2px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none;vertical-align:bottom}
.pt th[aria-sort]{color:var(--ink)}
.pt th.rot{height:118px;padding:6px 2px;text-align:center}
.pt th.rot span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block}
.pt th.grp{background:var(--accent-soft);color:var(--ink);text-align:center;cursor:default;font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:5px 8px;top:0}
.pt td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.pt tbody tr{cursor:pointer}
.pt tbody tr:hover td{background:var(--accent-soft)}
.pt tbody tr.sel td{background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.pt .stick{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:700}
.pt th.stick{z-index:3}
.pt td.c{text-align:center;padding:4px 3px;min-width:30px;font-weight:800}
.pt td.k1{background:var(--ok-bg);color:var(--ok)} .pt td.k2{background:var(--warn-bg);color:var(--warn)} .pt td.k3{background:var(--bad-bg);color:var(--bad)} .pt td.k4{background:var(--info-bg);color:var(--info)} .pt td.k0{color:var(--off)}
.pt td .d{display:block;font-size:10px;font-weight:600;opacity:.85}
.pcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start}
.pcstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pcstats .card{display:flex;flex-direction:column;gap:2px}
.pcstats .n{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
table.mx{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.mx th,.mx td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx th{color:var(--muted);font-size:12px}
.mx td.z{color:var(--off)}

.panel .ph{display:flex;align-items:flex-start;gap:10px}
.panel > *{flex-shrink:0}
@media (prefers-reduced-motion: no-preference){.item,.btn,.chip,.toggle{transition:background .15s,border-color .15s}}

  ['2.9', '2026-11-25', ['Gruppcheferna synkas automatiskt: ändringar som en gruppchef gör syns hos den andra inom någon minut. Det kräver att inkorgen är startad. Den andra gruppchefen kommer igång genom att öppna gruppfilen en gång.', 'Allt synkas krypterat. Servern kan inte läsa något. Ändrar ni samtidigt slås ändringarna ihop per person.']],

/* trevägs-sammanslagning: mina ändringar sedan senaste synk läggs ovanpå den andras version, fält för fält */
function mergeModels(base, mine, theirs) {
  const J = x => JSON.stringify(x ?? null);
  const map = arr => new Map((arr || []).map(p => [p.id, p]));
  const B = map(base.people), M = map(mine.people), T = map(theirs.people);
  const fbRows = (model, p) => p ? (model.fb || []).filter(f => f.name === fullName(p)).map(f => ({ typ: f.typ, date: f.date ?? null, note: f.note || '' })).sort((a, c) => J(a) < J(c) ? -1 : 1) : [];

    const v = { ...t };
    for (const k of new Set([...Object.keys(b), ...Object.keys(m)])) {
      if (J(m[k]) === J(b[k])) continue;
      if (J(t[k]) !== J(b[k]) && J(t[k]) !== J(m[k])) clash.add(name);
      if (m[k] === undefined) delete v[k]; else v[k] = m[k];
    }
    return v;
  };
  const ids = [...(theirs.people || []).map(p => p.id), ...(mine.people || []).map(p => p.id).filter(id => !T.has(id))];
  for (const id of ids) {
    const b = B.get(id), m = M.get(id), t = T.get(id);
    const bF = fbRows(base, b), mF = fbRows(mine, m), tF = fbRows(theirs, t);
    const myFb = m && J(mF) !== J(bF), myV = m && b && J(m.v) !== J(b.v);

    else if (t) { if (b && J(t.v) === J(b.v) && J(tF) === J(bF)) continue; v = t.v; }          // jag tog bort, de ändrade inget
    else { if (b && !myV && !myFb) continue; v = m.v; }                                         // de tog bort, jag ändrade inget
    const person = { id, v };
    if (t && m && b && myFb && J(tF) !== J(bF) && J(tF) !== J(mF)) clash.add(fullName(person));
    out.push({ person, fb: myFb ? mF : (t ? tF : mF) });

  if (ord(mine) !== ord(base)) { const pos = new Map((mine.people || []).map((p, i) => [p.id, i])); out.sort((x, y) => (pos.has(x.person.id) ? pos.get(x.person.id) : 1e9) - (pos.has(y.person.id) ? pos.get(y.person.id) : 1e9)); }

  return { model: res, clash: [...clash] };

      const mineStr = JSON.stringify(stripModel(S.model));
      let result = theirs, clash = [], merged = false;
      if (!sy.base) {
        /* första synken på den här enheten (eller nyss öppnad fil): fråga om versionerna skiljer sig */
        const core = x => JSON.stringify({ p: (x.people || []).map(q => [fullName(q), q.v]).sort(), f: (x.fb || []).map(f => [f.name, f.typ, f.date ?? null, f.note || '']).sort() });
        const norm = ensureCols(migrateFb(JSON.parse(theirsStr)));
        if (core(norm) !== core(S.model)) {
          const when = r.t ? new Date(r.t).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' }) : '';
          const keepMine = await dialog({ title: 'Två olika versioner', text: `Det finns redan en gemensam version av gruppen hos gruppcheferna${when ? ' (senast ändrad ' + when + ')' : ''}, och den skiljer sig från den som finns i din app${S.fileName ? ' (' + S.fileName + ')' : ''}. Vilken ska gälla för båda gruppcheferna? Den andra ersätts.`, ok: 'Använd min version', cancel: 'Använd den gemensamma' });
          if (keepMine) {

            const w = await api('PUT', `/api/g/${hv.g}/file`, hv.r, { box, base: rev }); S.model.sync = { rev: w.rev, base: cur0 };

          }

    }
